backend:
  name: github
  repo: darkbaronuk/ai-yte-handbook
  branch: main
  # Sveltia CMS dùng GitHub OAuth Device Flow (không cần dựng OAuth server riêng)
  auth_type: pkce
  app_id: Ov23liXXXXXXXXXXXXXX
  # ↑ THAY BẰNG GitHub OAuth App Client ID sau (xem hướng dẫn cuối phiên)

publish_mode: editorial_workflow
# ↑ Mọi save → tự tạo branch cms/... → mở Pull Request, không đụng thẳng main

media_folder: public/images
public_folder: /images

site_url: https://ai-yte.vn
display_url: https://ai-yte.vn
logo_url: https://ai-yte.vn/logo.png

locale: vi

collections:
  - name: chapters
    label: "Chương"
    label_singular: "Chương"
    folder: content/chapters
    create: false
    slug: "{{slug}}"
    identifier_field: title
    summary: "Ch.{{number}} — {{title}} [{{status}}]"
    sortable_fields: [number, status, updated]
    view_groups:
      - label: Theo phần
        field: part
      - label: Theo trạng thái
        field: status
    view_filters:
      - label: Đang viết (Draft)
        field: status
        pattern: draft
      - label: Chờ phản biện (Review)
        field: status
        pattern: review
      - label: Đã chốt (Final)
        field: status
        pattern: final
    fields:
      - { name: number, label: Số chương, widget: number, value_type: int }
      - { name: title, label: Tiêu đề, widget: string }
      - name: part
        label: Phần
        widget: select
        options:
          - "Phần I — Tiến trình"
          - "Phần II — Hiện trạng"
          - "Phần III — Hạ tầng"
          - "Phần IV — Tương lai"
      - name: status
        label: Trạng thái
        widget: select
        default: draft
        options:
          - { label: "Đang viết", value: draft }
          - { label: "Chờ phản biện", value: review }
          - { label: "Đã chốt", value: final }
      - name: domains
        label: Domain (WHO 2026)
        widget: select
        multiple: true
        options:
          - Patient Care
          - Data
          - Informatics
          - Communication
          - Technical
          - Digital Professionalism
          - Administration
      - name: miller
        label: Tầng Miller
        widget: select
        options:
          - "Knows"
          - "Knows → Knows How"
          - "Knows How"
          - "Knows How → Shows How"
          - "Shows How"
          - "Shows How → Does"
          - "Does"
      - name: owners
        label: Người phụ trách
        widget: list
        field: { name: name, label: Tên, widget: string }
      - { name: updated, label: Cập nhật, widget: datetime, format: "YYYY-MM-DD", date_format: true, time_format: false }
      - { name: summary, label: Tóm tắt, widget: text }
      - { name: body, label: Nội dung, widget: markdown }
