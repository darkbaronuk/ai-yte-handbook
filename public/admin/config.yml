backend:
  name: github
  repo: darkbaronuk/ai-yte-handbook
  branch: main
  # OAuth broker tự dựng trên chính Vercel (/api/auth, /api/callback)
  base_url: https://ai-yte-handbook.vercel.app
  auth_endpoint: api/auth

publish_mode: editorial_workflow
# ↑ Mọi save → tự tạo branch cms/... → mở Pull Request, không đụng thẳng main

media_folder: public/images
public_folder: /images

site_url: https://ai-yte.vn
display_url: https://ai-yte.vn
logo_url: https://ai-yte.vn/logo.png

locale: vi

collections:
  - name: chapters
    label: "Chương"
    label_singular: "Chương"
    folder: content/chapters
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "Ch.{{number}} — {{title}} [{{status}}]"
    preview_path: "chapters/{{slug}}"
    sortable_fields: [number, status, updated]
    view_groups:
      - label: Theo phần
        field: part
      - label: Theo trạng thái
        field: status
    view_filters:
      - label: Đang viết (Draft)
        field: status
        pattern: draft
      - label: Chờ phản biện (Review)
        field: status
        pattern: review
      - label: Đã chốt (Final)
        field: status
        pattern: final
    fields:
      - { name: number, label: Số chương, widget: number, value_type: int }
      - { name: title, label: Tiêu đề, widget: string }
      - name: part
        label: Phần
        widget: select
        options:
          - "Phần I — Tiến trình"
          - "Phần II — Hiện trạng"
          - "Phần III — Hạ tầng"
          - "Phần IV — Tương lai"
      - name: status
        label: Trạng thái
        widget: select
        default: draft
        options:
          - { label: "Đang viết", value: draft }
          - { label: "Chờ phản biện", value: review }
          - { label: "Đã chốt", value: final }
      - name: domains
        label: Domain (WHO 2026)
        widget: select
        multiple: true
        options:
          - Patient Care
          - Data
          - Informatics
          - Communication
          - Technical
          - Digital Professionalism
          - Administration
      - name: miller
        label: Tầng Miller
        widget: select
        options:
          - "Knows"
          - "Knows → Knows How"
          - "Knows How"
          - "Knows How → Shows How"
          - "Shows How"
          - "Shows How → Does"
          - "Does"
      - name: owners
        label: Người phụ trách
        widget: list
        field: { name: name, label: Tên, widget: string }
      - { name: updated, label: Cập nhật, widget: datetime, format: "YYYY-MM-DD", date_format: true, time_format: false }
      - { name: summary, label: Tóm tắt, widget: text, required: false }
      - { name: body, label: Nội dung, widget: markdown }

  - name: glossary
    label: "Thuật ngữ (Glossary)"
    label_singular: "Mục thuật ngữ"
    files:
      - name: glossary
        label: "Toàn bộ thuật ngữ"
        file: content/glossary.yml
        fields:
          - name: items
            label: Danh sách thuật ngữ
            widget: list
            summary: "{{fields.vi}} ({{fields.slug}})"
            fields:
              - { name: slug, label: "Slug (không dấu, gạch nối)", widget: string }
              - { name: vi, label: "Tiếng Việt", widget: string }
              - { name: en, label: "Tiếng Anh", widget: string }
              - { name: short, label: "Định nghĩa ngắn (1 câu)", widget: string }
              - { name: long, label: "Giải thích dài", widget: text, required: false }
