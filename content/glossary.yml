# Glossary — thuật ngữ AI trong y tế
# Dùng trong markdown: {t:slug}Chữ hiển thị{/t}
# Ví dụ: {t:rag}RAG{/t}, {t:llm}mô hình ngôn ngữ lớn{/t}
#
# Slug phải viết thường, không dấu, dùng gạch nối.

# ===== Nền tảng học máy =====

items:
- slug: ai
  vi: Trí tuệ nhân tạo
  en: Artificial Intelligence
  short: Ngành khoa học tạo ra máy có khả năng suy luận, học và ra quyết định như người.
  long: |
    Trí tuệ nhân tạo (AI) là lĩnh vực nghiên cứu và kỹ thuật hướng tới xây dựng hệ thống máy tính
    có khả năng thực hiện các nhiệm vụ vốn đòi hỏi trí tuệ con người: nhận dạng, hiểu ngôn ngữ,
    lập luận, ra quyết định, học từ kinh nghiệm. Trong y tế, AI được ứng dụng ở nhiều tầng, từ
    đọc ảnh chẩn đoán, hỗ trợ quyết định lâm sàng, đến quản trị vận hành bệnh viện.
- slug: ml
  vi: Học máy
  en: Machine Learning (ML)
  short: Nhóm phương pháp AI cho phép máy "học" quy luật từ dữ liệu thay vì được lập trình cứng.
  long: |
    Học máy là nhánh AI nghiên cứu các thuật toán cho phép máy tính học các quy luật từ dữ liệu
    và cải thiện hiệu năng theo thời gian mà không cần lập trình rõ ràng cho từng trường hợp.
    Các dòng chính gồm học có giám sát (supervised), không giám sát (unsupervised), và tăng cường
    (reinforcement).
- slug: deep-learning
  vi: Học sâu
  en: Deep Learning
  short: Nhánh học máy dùng mạng nơ-ron nhiều tầng để học các biểu diễn phân cấp từ dữ liệu.
  long: |
    Học sâu là nhánh học máy dùng mạng nơ-ron nhân tạo có nhiều tầng ẩn (thường vài chục đến vài
    trăm tầng) để tự động học các đặc trưng phân cấp từ dữ liệu thô. Đây là công nghệ cốt lõi
    đứng sau đa số đột phá AI hiện đại: đọc ảnh y khoa, nhận dạng giọng nói, và các mô hình
    ngôn ngữ lớn.
- slug: neural-network
  vi: Mạng nơ-ron
  en: Neural Network
  short: Mô hình tính toán mô phỏng mạng lưới nơ-ron thần kinh, gồm các nút liên kết trọng số.
  long: |
    Mạng nơ-ron nhân tạo là mô hình tính toán gồm nhiều nút (neuron) tổ chức thành các tầng, kết
    nối với nhau bằng trọng số. Mạng học bằng cách điều chỉnh trọng số qua thuật toán lan truyền
    ngược (backpropagation) để giảm sai số dự đoán.
- slug: transformer
  vi: Kiến trúc Transformer
  en: Transformer
  short: Kiến trúc mạng nơ-ron dựa trên cơ chế self-attention, nền tảng của các LLM hiện đại.
  long: |
    Transformer là kiến trúc mạng nơ-ron được Google giới thiệu năm 2017 trong bài "Attention Is
    All You Need". Điểm cốt lõi là cơ chế self-attention cho phép mô hình đánh giá quan hệ giữa
    mọi cặp phần tử trong chuỗi đầu vào cùng lúc, thay vì tuần tự như RNN. Đây là nền tảng của
    GPT, Claude, Gemini và mọi mô hình ngôn ngữ lớn hiện đại.
- slug: cnn
  vi: Mạng nơ-ron tích chập
  en: Convolutional Neural Network (CNN)
  short: Kiến trúc mạng nơ-ron chuyên xử lý dữ liệu dạng lưới, đặc biệt là hình ảnh.
  long: |
    CNN là kiến trúc mạng nơ-ron dùng phép tích chập (convolution) để trích xuất đặc trưng cục bộ
    từ hình ảnh. Nó là công nghệ chuẩn cho đọc ảnh y khoa (X-quang, CT, MRI, giải phẫu bệnh) từ
    2015 đến gần đây, khi Vision Transformer bắt đầu cạnh tranh.
- slug: gan
  vi: Mạng đối kháng sinh mẫu
  en: Generative Adversarial Network (GAN)
  short: Kiến trúc gồm hai mạng cạnh tranh nhau để sinh dữ liệu giả trông thật.
  long: |
    GAN gồm hai mạng nơ-ron thi đấu với nhau: một mạng sinh (generator) tạo mẫu giả, một mạng
    phân biệt (discriminator) đánh giá thật/giả. Qua nhiều vòng, mạng sinh ngày càng giỏi tạo ra
    mẫu giống thật. Trong y tế, GAN được dùng bù dữ liệu hiếm (như XPGAN của VinBrain tạo ảnh
    X-quang COVID).
- slug: supervised-learning
  vi: Học có giám sát
  en: Supervised Learning
  short: Học từ dữ liệu đã được gán nhãn để dự đoán nhãn cho dữ liệu mới.
  long: |
    Trong học có giám sát, mô hình học từ tập dữ liệu gồm cặp (đầu vào, nhãn đúng). Ví dụ y tế:
    học phân biệt X-quang bình thường/bất thường từ 15.000 ảnh đã được bác sĩ gán nhãn.
- slug: unsupervised-learning
  vi: Học không giám sát
  en: Unsupervised Learning
  short: Học tìm quy luật ẩn trong dữ liệu không có nhãn.
  long: |
    Học không giám sát tìm cấu trúc ẩn trong dữ liệu chưa gán nhãn — ví dụ phân cụm bệnh nhân
    theo hồ sơ điều trị, phát hiện bất thường trong dữ liệu vận hành bệnh viện.
- slug: reinforcement-learning
  vi: Học tăng cường
  en: Reinforcement Learning (RL)
  short: Học bằng thử-sai, tối ưu phần thưởng dài hạn qua tương tác với môi trường.
  long: |
    Trong học tăng cường, tác nhân (agent) học chính sách hành động tối ưu bằng cách thử nghiệm
    và nhận phần thưởng/hình phạt từ môi trường. Ứng dụng y tế đang trong nghiên cứu: liều thuốc
    tối ưu, chính sách điều trị hồi sức, robot phẫu thuật.
- slug: transfer-learning
  vi: Học chuyển giao
  en: Transfer Learning
  short: Tận dụng mô hình đã huấn luyện trên tác vụ khác để giải bài toán mới với ít dữ liệu.
  long: |
    Học chuyển giao lấy một mô hình đã huấn luyện trên dữ liệu lớn (ví dụ ImageNet cho ảnh
    thường) rồi tinh chỉnh cho tác vụ mới (đọc ảnh y khoa). Rất hữu ích khi dữ liệu chuyên biệt
    ít — điều thường gặp trong y tế.
- slug: fine-tuning
  vi: Tinh chỉnh mô hình
  en: Fine-tuning
  short: Huấn luyện thêm một mô hình đã có sẵn trên dữ liệu chuyên biệt để nó phù hợp tác vụ mới.
  long: |
    Fine-tuning là quá trình tiếp tục huấn luyện một mô hình đã pre-trained trên tập dữ liệu
    chuyên ngành, để nó chuyển từ "biết tổng quát" thành "giỏi chuyên biệt". Ví dụ: fine-tune
    LLM tổng quát trên tập câu hỏi–đáp y khoa để có chatbot chuyên khoa.
- slug: llm
  vi: Mô hình ngôn ngữ lớn
  en: Large Language Model (LLM)
  short: >-
    Mô hình AI học từ lượng lớn dữ liệu ngôn ngữ để xử lý và tạo văn bản; câu trả lời không mặc
    nhiên đúng.
  long: >-
    LLM hỗ trợ hỏi đáp, tóm tắt và soạn thảo bằng ngôn ngữ tự nhiên. Trong y tế, câu trả lời trôi
    chảy có thể vẫn sai hoặc thiếu căn cứ; người dùng phải kiểm chứng thông tin quan trọng và chỉ
    nhập dữ liệu trong phạm vi được phép. Không phải mọi chatbot đều dùng LLM.
  sources:
    - title: OWASP Top 10 for LLM Applications 2025
      url: https://owasp.org/www-project-top-10-for-large-language-model-applications/assets/PDF/OWASP-Top-10-for-LLMs-v2025.pdf
    - title: 'WHO: đạo đức và quản trị AI y tế'
      url: https://www.who.int/publications/i/item/9789240029200
- slug: generative-ai
  vi: AI sinh tạo
  en: Generative AI
  short: Các mô hình AI có khả năng tạo ra nội dung mới — văn bản, hình ảnh, âm thanh, video.
  long: |
    AI sinh tạo là nhóm mô hình AI tạo ra dữ liệu mới thay vì chỉ phân loại. Bao gồm LLM sinh
    văn bản, mô hình sinh ảnh (Stable Diffusion, DALL-E), sinh giọng nói, sinh video. Đây là
    làn sóng công nghệ chi phối chuyển đổi số y tế từ 2023.
- slug: rag
  vi: Sinh nội dung có hỗ trợ truy xuất
  en: Retrieval-Augmented Generation (RAG)
  short: Tìm tài liệu liên quan rồi đưa vào ngữ cảnh để AI tạo câu trả lời có căn cứ tham khảo.
  long: >-
    Một trợ lý có thể truy xuất đoạn hướng dẫn chuyên môn từ kho được duyệt, rồi cung cấp đoạn đó
    cho LLM khi trả lời. RAG không bảo đảm câu trả lời luôn đúng hoặc an toàn: tài liệu có thể sai,
    lỗi thời, chứa chỉ dẫn đánh lừa hoặc ngoài quyền truy cập. Cần kiểm soát nguồn, phiên bản, quyền
    truy xuất và kiểm chứng đầu ra.
  sources:
    - title: OWASP Top 10 for LLM Applications 2025
      url: https://owasp.org/www-project-top-10-for-large-language-model-applications/assets/PDF/OWASP-Top-10-for-LLMs-v2025.pdf
- slug: prompt
  vi: Câu lệnh dẫn
  en: Prompt
  short: Đoạn văn bản đầu vào cho LLM, chỉ dẫn nó làm gì và trả lời ra sao.
  long: |
    Prompt là đầu vào của LLM. Chất lượng và định dạng prompt quyết định phần lớn chất lượng
    output. Nghệ thuật viết prompt tốt (prompt engineering) là kỹ năng cốt lõi khi làm việc với
    LLM trong y tế: phải nêu rõ vai trò, ràng buộc an toàn, định dạng đầu ra, và ngữ cảnh bệnh
    nhân nếu có.
- slug: embedding
  vi: Biểu diễn dữ liệu bằng véc-tơ
  en: Embedding
  short: Biến nội dung thành dãy số để hệ thống so sánh và tìm nội dung liên quan.
  long: >-
    Embedding biểu diễn văn bản, ảnh hoặc dữ liệu khác bằng một véc-tơ, tức dãy số. Trong trợ lý
    truy xuất tài liệu, hệ thống có thể so sánh các biểu diễn này để tìm đoạn phù hợp với câu hỏi.
    Gần nhau về biểu diễn không bảo đảm nội dung đúng hoặc người hỏi có quyền xem; biểu diễn dữ liệu
    cũng không mặc nhiên là dữ liệu đã khử nhận dạng.
  sources:
    - title: OWASP Top 10 for LLM Applications 2025
      url: https://owasp.org/www-project-top-10-for-large-language-model-applications/assets/PDF/OWASP-Top-10-for-LLMs-v2025.pdf
- slug: vector-db
  vi: Cơ sở dữ liệu véc-tơ
  en: Vector Database
  short: Kho lưu embedding và tìm kiếm các véc-tơ gần nhau nhanh chóng.
  long: |
    Vector database (Pinecone, Weaviate, Qdrant, pgvector) lưu hàng triệu embedding và cho phép
    truy vấn "tìm k véc-tơ gần nhất" trong mili giây. Là hạ tầng bắt buộc cho hệ RAG quy mô.
- slug: token
  vi: Token
  en: Token
  short: Đơn vị nhỏ nhất mà LLM xử lý — thường là 1 từ hoặc 1 phần của từ.
  long: |
    LLM không xử lý ký tự mà xử lý token — đơn vị đã được tokenizer chia. Với tiếng Anh,
    1 token ≈ 4 ký tự ≈ 0,75 từ. Với tiếng Việt có dấu, tokenization thường tốn nhiều token hơn.
    Chi phí gọi API LLM tính theo số token input và output.
- slug: context-window
  vi: Cửa sổ ngữ cảnh
  en: Context Window
  short: Số token tối đa LLM có thể "nhớ" trong một lượt hội thoại.
  long: |
    Context window là giới hạn số token mà LLM xử lý trong một lượt. GPT-4 là 128k, Claude
    Opus 5 là 500k, Gemini 3 lên tới 2 triệu (2026). Ngữ cảnh dài giúp đưa cả bệnh án dài
    hoặc nhiều tài liệu vào prompt cùng lúc.
- slug: hallucination
  vi: Thông tin bịa đặt của AI (ảo giác)
  en: Hallucination
  short: AI tạo nội dung không có căn cứ hoặc sai sự thật nhưng vẫn có vẻ hợp lý.
  long: >-
    Ví dụ mô phỏng: trợ lý bịa tên nghiên cứu, điều luật hoặc thêm kết quả xét nghiệm không có trong
    hồ sơ. Không phải cứ thông tin mới hoặc không nằm trong dữ liệu huấn luyện là ảo giác. Truy xuất
    tài liệu và yêu cầu dẫn nguồn có thể hỗ trợ kiểm chứng nhưng không bảo đảm loại bỏ sai sót; phải
    mở nguồn và đối chiếu nội dung.
  sources:
    - title: OWASP Top 10 for LLM Applications 2025
      url: https://owasp.org/www-project-top-10-for-large-language-model-applications/assets/PDF/OWASP-Top-10-for-LLMs-v2025.pdf
- slug: agent
  vi: Tác nhân AI
  en: AI Agent
  short: Hệ AI có khả năng lập kế hoạch nhiều bước và tự thao tác công cụ để hoàn thành nhiệm vụ.
  long: |
    Khác với chatbot chỉ trả lời từng lượt, AI agent có thể lập kế hoạch, gọi công cụ (API,
    database, phần mềm), phản hồi và điều chỉnh nhiều lần đến khi hoàn thành mục tiêu. Chi tiết
    xem Chương 9.
- slug: cdss
  vi: Hệ hỗ trợ quyết định lâm sàng
  en: Clinical Decision Support System (CDSS)
  short: >-
    Hệ thống cung cấp cảnh báo, thông tin hoặc gợi ý cho quyết định chăm sóc; có thể dùng quy tắc
    hoặc AI.
  long: >-
    CDSS hỗ trợ bác sĩ, dược sĩ và nhân viên y tế bằng cảnh báo tương tác thuốc, nhắc việc hoặc gợi
    ý theo dữ liệu. Hệ thống có thể dựa trên quy tắc lập sẵn, mô hình thống kê hoặc AI; không mặc
    định mọi CDSS đều là AI. Đầu ra cần được đặt trong ngữ cảnh lâm sàng và quy trình chuyên môn.
  sources:
    - title: Tổng quan CDSS, npj Digital Medicine
      url: https://www.nature.com/articles/s41746-020-0221-y
- slug: cad
  vi: Hỗ trợ chẩn đoán có máy tính
  en: Computer-Aided Diagnosis (CAD)
  short: Công cụ giúp bác sĩ đọc ảnh y khoa chính xác hơn.
  long: |
    CAD là phần mềm dùng thuật toán (nay chủ yếu là học sâu) để tự động phát hiện, khoanh vùng
    và định lượng bất thường trên ảnh y khoa. Ứng dụng phổ biến: đọc X-quang phổi, chụp nhũ ảnh,
    nội soi, CT/MRI. Xem Chương 5.
- slug: pacs
  vi: Hệ lưu trữ và truyền ảnh y khoa
  en: Picture Archiving and Communication System (PACS)
  short: Kho lưu trữ tập trung ảnh y khoa DICOM của bệnh viện.
  long: |
    PACS là hệ thống của khoa Chẩn đoán hình ảnh, lưu trữ và phân phối ảnh DICOM (X-quang, CT,
    MRI, siêu âm) giữa các máy chụp và trạm đọc. Mọi AI đọc ảnh phải tích hợp được với PACS
    theo chuẩn DICOM.
- slug: dicom
  vi: Chuẩn thông tin và ảnh y khoa số
  en: Digital Imaging and Communications in Medicine (DICOM)
  short: Chuẩn lưu trữ, trao đổi ảnh và thông tin y khoa; tệp có thể chứa dữ liệu nhận diện người bệnh.
  long: >-
    DICOM quy định cách biểu diễn và trao đổi ảnh cùng thông tin liên quan. Tệp có thể chứa họ tên,
    mã người bệnh hoặc ngày sinh, nhưng không phải tệp DICOM nào cũng còn định danh. Khử nhận dạng
    cần xét các thuộc tính, chữ in trên ảnh và đặc điểm nhận diện trong ảnh; đổi tên tệp hay xóa vài
    trường không đủ bảo đảm an toàn.
  sources:
    - title: DICOM PS3.15, Phụ lục E
      url: https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_e.html
- slug: emr
  vi: Bệnh án điện tử
  en: Electronic Medical Record (EMR)
  short: Hồ sơ y tế điện tử của bệnh nhân tại một cơ sở khám chữa bệnh.
  long: |
    EMR là hệ thống lưu trữ toàn bộ dữ liệu lâm sàng của bệnh nhân tại một bệnh viện: hành
    chính, tiền sử, khám, chỉ định, đơn thuốc, kết quả cận lâm sàng. Việt Nam đặt mục tiêu 100%
    bệnh viện có EMR đến 2030.
- slug: ehr
  vi: Hồ sơ sức khỏe điện tử
  en: Electronic Health Record (EHR)
  short: Hồ sơ sức khỏe liên thông giữa nhiều cơ sở, bao gồm cả tự khai và wearable.
  long: |
    EHR rộng hơn EMR: dữ liệu di chuyển được giữa các cơ sở, có thể tích hợp dữ liệu bệnh nhân
    tự khai và thiết bị đo cá nhân. VietPHR là một hướng đi PHR/EHR cho Việt Nam.
- slug: phr
  vi: Hồ sơ sức khỏe cá nhân
  en: Personal Health Record (PHR)
  short: Bản sao hồ sơ y tế thuộc quyền quản lý của bệnh nhân, có thể chia sẻ khi cần.
  long: |
    PHR là bản ghi sức khỏe do bệnh nhân sở hữu và kiểm soát. Bệnh nhân quyết định chia sẻ với
    bác sĩ nào, cơ sở nào. PHR tốt cho phép nhập tay, đồng bộ từ EMR bệnh viện, và tiếp nhận
    dữ liệu từ wearable.
- slug: fhir
  vi: Chuẩn dữ liệu y tế FHIR
  en: HL7 FHIR
  short: Chuẩn quốc tế để trao đổi dữ liệu y tế giữa các hệ thống qua web API hiện đại.
  long: |
    FHIR (Fast Healthcare Interoperability Resources) do HL7 phát hành, là chuẩn dữ liệu y tế
    thế hệ mới dùng REST API và JSON/XML. Đơn vị dữ liệu là "resource" (Patient, Observation,
    MedicationRequest…). Là chuẩn được khuyến nghị cho mọi hệ thống EMR/EHR mới ở Việt Nam.
- slug: hl7
  vi: Chuẩn dữ liệu y tế HL7
  en: HL7
  short: Bộ chuẩn dữ liệu y tế lâu đời, tiền thân của FHIR.
  long: |
    HL7 (Health Level 7) là tổ chức phi lợi nhuận phát hành nhiều chuẩn dữ liệu y tế từ thập
    niên 1980. HL7 v2 vẫn phổ biến trong tích hợp hệ thống bệnh viện; HL7 FHIR là thế hệ mới.
- slug: telemedicine
  vi: Y tế từ xa
  en: Telemedicine
  short: Cung cấp dịch vụ y tế qua kênh viễn thông — video, tin nhắn, tư vấn từ xa.
  long: |
    Telemedicine là các hoạt động y tế thực hiện qua công nghệ viễn thông, không đòi hỏi bệnh
    nhân và bác sĩ cùng địa điểm. Bao gồm hội chẩn từ xa, khám tư vấn video, theo dõi bệnh
    mạn tính qua wearable, dạy học từ xa cho y sinh.
- slug: hipaa
  vi: Đạo luật HIPAA của Hoa Kỳ
  en: Health Insurance Portability and Accountability Act
  short: >-
    Luật Hoa Kỳ với các quy định bảo vệ thông tin sức khỏe; không tự động áp dụng cho mọi cơ sở Việt
    Nam.
  long: >-
    Quy tắc về quyền riêng tư theo HIPAA điều chỉnh thông tin sức khỏe được bảo vệ của những chủ thể
    thuộc phạm vi áp dụng, gồm các covered entities và business associates tương ứng. Không dùng
    nhãn PHI hoặc tuyên bố nhà cung cấp tuân thủ HIPAA để thay thế việc đánh giá nghĩa vụ theo pháp
    luật Việt Nam.
  sources:
    - title: 'HHS: Summary of the HIPAA Privacy Rule'
      url: https://www.hhs.gov/hipaa/for-professionals/privacy/laws-regulations/index.html
    - title: Luật 91/2025/QH15, bản tiếng Việt
      url: https://mps.gov.vn/chinh-sach-phap-luat/co-so-du-lieu-van-ban/luat-bao-ve-du-lieu-ca-nhan-1753688803
- slug: gdpr
  vi: Quy định GDPR
  en: GDPR
  short: Luật bảo vệ dữ liệu cá nhân của Liên minh châu Âu.
  long: |
    GDPR (General Data Protection Regulation) là quy định bảo vệ dữ liệu cá nhân của EU từ
    2018. Áp dụng cho mọi tổ chức xử lý dữ liệu công dân EU, kể cả ngoài EU. Có ảnh hưởng
    lớn đến các nghiên cứu y sinh đa quốc gia và các nhà cung cấp AI y tế toàn cầu.
- slug: pdpd
  vi: Nghị định 13/2023/NĐ-CP (văn bản lịch sử)
  en: Personal Data Protection Decree 13/2023
  short: Nghị định về bảo vệ dữ liệu cá nhân trước đây; hết hiệu lực từ 01/01/2026 theo Nghị định 356.
  long: >-
    Giữ mục này để đọc các dẫn chiếu lịch sử trong cẩm nang. Nghị định 356/2025/NĐ-CP quy định Nghị
    định 13/2023/NĐ-CP hết hiệu lực từ 01/01/2026. Với hoạt động hiện tại, cần đối chiếu Luật
    91/2025/QH15 và văn bản hướng dẫn phù hợp, không dùng Nghị định 13 như căn cứ hiện hành độc lập.
  sources:
    - title: Nghị định 356/2025/NĐ-CP
      url: https://vbpl.vn/TW/Lists/vbpq/Attachments/187276/ND.356.2025.doc
    - title: Luật 91/2025/QH15, bản tiếng Việt
      url: https://mps.gov.vn/chinh-sach-phap-luat/co-so-du-lieu-van-ban/luat-bao-ve-du-lieu-ca-nhan-1753688803
- slug: fda-samd
  vi: SaMD của FDA
  en: FDA Software as a Medical Device
  short: Phần mềm được FDA phân loại là thiết bị y tế và phải qua kiểm định trước khi lưu hành.
  long: |
    FDA Hoa Kỳ phân loại phần mềm y tế (SaMD) theo mức rủi ro và yêu cầu phê duyệt tương ứng.
    Hầu hết AI đọc ảnh chẩn đoán rơi vào Class II (510(k) clearance). Nhiều AI Việt Nam (như
    DrAid) đang theo đuổi 510(k) để mở đường sang thị trường Mỹ.
- slug: ce-mark
  vi: Chứng nhận CE
  en: CE Mark
  short: Chứng nhận cần thiết để lưu hành thiết bị y tế (kể cả AI) tại EU.
  long: |
    CE Mark là dấu chứng nhận hàng hóa đạt các quy chuẩn của EU. Với thiết bị y tế, CE Mark
    được cấp theo Medical Device Regulation (MDR) mới có hiệu lực 2021. AI y tế thường thuộc
    Class IIa hoặc IIb, phải qua Notified Body kiểm định.
- slug: auc
  vi: Diện tích dưới đường ROC
  en: Area Under the ROC Curve (AUC)
  short: Chỉ số đo hiệu năng phân loại nhị phân, càng gần 1 càng tốt.
  long: |
    AUC là chỉ số phổ biến để đánh giá mô hình phân loại y khoa. AUC = 1 là hoàn hảo, AUC =
    0,5 là ngẫu nhiên. AUC > 0,9 thường được coi là tốt cho ứng dụng lâm sàng, nhưng phải
    kết hợp thêm độ nhạy/đặc hiệu ở ngưỡng vận hành.
- slug: sensitivity-specificity
  vi: Độ nhạy và độ đặc hiệu
  en: Sensitivity & Specificity
  short: Hai chỉ số cơ bản đo khả năng của mô hình phát hiện đúng bệnh (nhạy) và loại trừ đúng (đặc hiệu).
  long: |
    Độ nhạy = tỷ lệ phát hiện đúng ca bệnh. Độ đặc hiệu = tỷ lệ loại trừ đúng ca không bệnh.
    Hai chỉ số này đánh đổi nhau qua ngưỡng phân loại. Trong sàng lọc, ưu tiên nhạy cao. Trong
    chẩn đoán xác định, ưu tiên đặc hiệu cao.
- slug: ppv-npv
  vi: Giá trị tiên đoán dương và âm
  en: PPV & NPV
  short: Xác suất bệnh nhân thực sự có/không bệnh khi kết quả xét nghiệm là dương/âm.
  long: |
    PPV (Positive Predictive Value) = xác suất bệnh nhân thật sự có bệnh khi kết quả xét
    nghiệm dương. NPV = tương ứng cho kết quả âm. Cả hai phụ thuộc vào tỷ lệ mắc bệnh trong
    quần thể — quan trọng khi diễn giải AI sàng lọc.
- slug: llm-as-judge
  vi: LLM làm giám khảo
  en: LLM-as-Judge
  short: Dùng một LLM mạnh để đánh giá chất lượng câu trả lời của LLM khác.
  long: |
    LLM-as-Judge là kỹ thuật đánh giá tự động: đưa cho một LLM mạnh (thường là GPT-6 hoặc
    Claude Opus 5) một cặp câu hỏi-trả lời và rubric, yêu cầu chấm điểm. Rẻ và nhanh hơn thuê
    người, nhưng phải kiểm định lại bằng bộ mẫu người chấm.
- slug: gpu
  vi: Card đồ họa
  en: GPU
  short: Bộ xử lý đồ họa, dùng cho tính toán song song lớn, là trụ cột huấn luyện AI.
  long: |
    GPU (Graphics Processing Unit) ban đầu dành cho đồ họa, nay là phần cứng chuẩn cho AI.
    NVIDIA thống trị thị trường với dòng chuyên dụng: RTX 6000 Ada/Blackwell cho workstation,
    H100/H200 cho datacenter, và các dòng consumer RTX 4090/5090.
- slug: rtx-6000
  vi: NVIDIA RTX 6000
  en: NVIDIA RTX 6000
  short: Dòng GPU workstation cao cấp của NVIDIA, phù hợp phòng lab AI y tế quy mô nhỏ đến trung.
  long: |
    RTX 6000 Ada Generation có 48GB VRAM, đủ chạy các LLM 70B ở dạng đã lượng tử hóa. Phiên bản
    Blackwell (2025) tăng lên 96GB VRAM và cải thiện đáng kể hiệu năng inference. Xem Chương 13.
- slug: h100
  vi: NVIDIA H100
  en: NVIDIA H100
  short: GPU datacenter chuyên dụng cho huấn luyện AI quy mô lớn.
  long: |
    H100 là GPU datacenter đầu bảng của NVIDIA từ 2022, với 80GB HBM3 và Transformer Engine
    tối ưu cho LLM. Giá đơn cỡ 30.000 USD/chiếc và thường bán theo cụm DGX. Không phù hợp
    workstation lab nhỏ ở Việt Nam.
- slug: quantization
  vi: Lượng tử hóa mô hình
  en: Quantization
  short: Nén mô hình bằng cách giảm độ chính xác của trọng số, để chạy được trên phần cứng yếu hơn.
  long: |
    Quantization giảm độ chính xác trọng số mô hình từ FP32 xuống FP16, INT8, hoặc thậm chí
    INT4. Đánh đổi: tiết kiệm bộ nhớ và tăng tốc, nhưng giảm nhẹ chất lượng. Là kỹ thuật cần
    thiết để chạy LLM lớn trên GPU workstation.
- slug: inference
  vi: Suy luận
  en: Inference
  short: Giai đoạn chạy mô hình đã huấn luyện để cho ra dự đoán/kết quả.
  long: |
    Inference là công đoạn sau khi mô hình đã huấn luyện: đưa dữ liệu mới vào, mô hình trả ra
    kết quả. Chi phí và tốc độ inference quyết định tính khả thi triển khai lâm sàng — một mô
    hình đọc ảnh phải trả kết quả trong vài giây, không phải vài phút.
- slug: agi
  vi: Trí tuệ nhân tạo tổng quát
  en: Artificial General Intelligence (AGI)
  short: AI có năng lực nhận thức ngang hoặc vượt người trên hầu hết nhiệm vụ trí tuệ.
  long: |
    AGI là khái niệm về AI có khả năng suy luận, học và giải quyết vấn đề ở mức tương đương
    hoặc vượt người trong hầu hết lĩnh vực. GPT-6 Astra (OpenAI, 2026) là bước gần AGI đầu
    tiên có công bố chính thức. Xem Chương 15.
- slug: alignment
  vi: Căn chỉnh AI
  en: AI Alignment
  short: Lĩnh vực nghiên cứu đảm bảo AI hoạt động theo giá trị và ý định của con người.
  long: |
    Alignment là bài toán trung tâm của AI an toàn: làm sao đảm bảo AI mạnh hành động phù hợp
    ý định người dùng, không lệch mục tiêu, không lừa dối, không gây hại. Đặc biệt cấp bách
    khi AI tiến gần AGI.
- slug: red-teaming
  vi: Kiểm thử đối kháng
  en: Red-Teaming
  short: Thử nghiệm có tổ chức để tìm điểm yếu, lỗ hổng an toàn của hệ thống AI.
  long: |
    Red-teaming là quy trình có nhóm chuyên gia đóng vai kẻ tấn công/dùng sai để tìm lỗ hổng
    hệ thống AI: prompt injection, hallucination gây hại, thiên kiến. Bắt buộc trước khi triển
    khai AI trong bối cảnh lâm sàng.
- slug: model-card
  vi: Thẻ mô tả mô hình
  en: Model Card
  short: 'Tài liệu mô tả tóm tắt mô hình AI: dữ liệu huấn luyện, hiệu năng, giới hạn, đạo đức.'
  long: |
    Model card là chuẩn tài liệu do Google/Mitchell (2019) đề xuất, mô tả mô hình AI theo
    bảng nhất quán: mục đích, dữ liệu, hiệu năng phân theo nhóm nhân khẩu, giới hạn, khuyến
    cáo dùng. Nay là chuẩn bắt buộc trong xuất bản AI y tế.
- slug: foundation-model
  vi: Mô hình nền
  en: Foundation Model
  short: Mô hình AI khổng lồ huấn luyện trên dữ liệu đa dạng, thích ứng cho nhiều nhiệm vụ.
  long: |
    Foundation model là mô hình lớn (thường LLM hoặc multimodal) huấn luyện tự giám sát
    trên khối dữ liệu lớn, sau đó tinh chỉnh cho tác vụ cụ thể. GPT-4, Claude, Gemini,
    LLaMA đều là foundation model. Đặc điểm: khả năng chuyển giao mạnh, nhưng khó kiểm soát.
- slug: instruction-tuning
  vi: Tinh chỉnh theo hướng dẫn
  en: Instruction Tuning
  short: Bước huấn luyện dạy mô hình làm theo yêu cầu ngôn ngữ tự nhiên.
  long: |
    Instruction tuning dùng dataset gồm cặp (chỉ dẫn, câu trả lời chuẩn) để tinh chỉnh
    foundation model, giúp mô hình trả lời đúng ý người dùng thay vì tiếp tục sinh văn bản
    ngẫu nhiên. FLAN, InstructGPT là ví dụ điển hình. Là bước quan trọng biến base model
    thành chatbot dùng được.
- slug: rlhf
  vi: Học tăng cường từ phản hồi con người
  en: RLHF (Reinforcement Learning from Human Feedback)
  short: Kỹ thuật huấn luyện mô hình dựa trên đánh giá của con người về chất lượng câu trả lời.
  long: |
    RLHF thu thập phản hồi so sánh của người (câu trả lời nào tốt hơn), huấn luyện reward
    model, rồi dùng reinforcement learning tối ưu mô hình theo reward đó. Là chìa khóa
    khiến ChatGPT vượt xa GPT-3 về mức độ hữu ích. Nhược: reward hack, tốn kém, khó mở rộng.
- slug: chain-of-thought
  vi: Suy luận chuỗi
  en: Chain-of-Thought (CoT)
  short: Kỹ thuật cho LLM viết ra các bước suy luận trước khi đưa đáp án cuối.
  long: |
    Chain-of-thought yêu cầu mô hình "think step by step" trước khi trả lời. Tăng độ chính
    xác trên toán, logic, chẩn đoán y khoa. Là nền tảng của reasoning models như o1/o3
    (OpenAI), Claude 4 Sonnet Thinking, Astra Deep-Think.
- slug: leapspace
  vi: LeapSpace
  en: LeapSpace
  short: Nền tảng AI hỗ trợ nghiên cứu y sinh do Elsevier phát triển từ ScienceDirect.
  long: |
    LeapSpace là hệ thống AI được Elsevier ra mắt cuối 2024, tích hợp trên ScienceDirect
    cho phép hỏi đáp có dẫn nguồn từ 20+ triệu bài báo y sinh peer-reviewed. Dùng foundation
    model tinh chỉnh cho biomedical + RAG grounding chặt. Được nhiều bs Việt Nam dùng thay
    UpToDate cho tra cứu kỳ thi ghép hạng.
- slug: multi-modal
  vi: Đa phương thức
  en: Multi-modal
  short: 'Mô hình AI xử lý được nhiều loại input: text, ảnh, âm thanh, video.'
  long: |
    Multi-modal LLM có thể nhận input hỗn hợp: bác sĩ đưa ảnh X-quang + câu hỏi văn bản +
    lịch sử bệnh nhân, mô hình trả lời tích hợp. GPT-4V, Gemini, Claude 3 Opus đều đa
    phương thức. Đến 2026, đa số foundation model y tế đều native multi-modal.
- slug: nq57
  vi: Nghị quyết 57-NQ/TW
  en: Resolution No. 57-NQ/TW
  short: Nghị quyết Bộ Chính trị 22/12/2024 về đột phá KHCN, đổi mới sáng tạo, chuyển đổi số quốc gia.
  long: |
    Nghị quyết 57-NQ/TW của Bộ Chính trị ngày 22/12/2024 xác định KHCN, đổi mới sáng tạo
    và chuyển đổi số là "đột phá quan trọng hàng đầu" của quốc gia. Với ngành y tế, Bộ Y tế
    được giao 386 nhiệm vụ, hoàn thành 375 tính đến 5/2026. NQ57 mở đường pháp lý cho
    Luật AI, Luật CN CNS và các thông tư chuyên ngành sau đó.
- slug: nq72
  vi: Nghị quyết 72-NQ/TW
  en: Resolution No. 72-NQ/TW
  short: Nghị quyết Bộ Chính trị 9/9/2025 về bảo vệ, chăm sóc và nâng cao sức khỏe nhân dân.
  long: |
    Nghị quyết 72-NQ/TW do Tổng Bí thư Tô Lâm ký ngày 9/9/2025 đặt các mục tiêu cụ thể:
    khám sức khỏe miễn phí ít nhất 1 lần/năm cho mọi người dân từ 2026, sổ sức khỏe điện tử
    toàn dân, mỗi trạm y tế xã có 4-5 bác sĩ đến 2027, tuổi thọ trung bình 75,5 (68 năm khỏe
    mạnh) đến 2030. Đây là cơ sở chính sách cho hạ tầng dữ liệu y tế toàn dân.
- slug: luatai
  vi: Luật Trí tuệ nhân tạo 134/2025/QH15
  en: Law on Artificial Intelligence
  short: Luật AI của Việt Nam, có hiệu lực từ 01/03/2026; phân loại rủi ro tại Điều 9.
  long: >-
    Luật đặt nguyên tắc kiểm soát và trách nhiệm của con người, cùng yêu cầu theo vai trò và mức rủi
    ro của hệ AI. Điều 9 về phân loại, Điều 10 về trách nhiệm phân loại và thông báo; Điều 13 về
    đánh giá sự phù hợp hệ rủi ro cao. Không xếp mọi công cụ dùng trong y tế vào một mức rủi ro chỉ
    dựa trên tên gọi. Đọc cùng văn bản hướng dẫn và danh mục hiện hành được dẫn trong chương XIV.
  sources:
    - title: Luật Trí tuệ nhân tạo 134/2025/QH15
      url: https://luatvietnam.vn/khoa-hoc/luat-tri-tue-nhan-tao-2025-so-134-2025-qh15-422299-d1.html
- slug: tt13
  vi: Thông tư 13/2025/TT-BYT
  en: Circular 13/2025/TT-BYT
  short: Thông tư Bộ Y tế bắt buộc mọi bệnh viện triển khai bệnh án điện tử chậm nhất 30/9/2026.
  long: |
    Thông tư 13/2025/TT-BYT ban hành ngày 6/6/2025 hướng dẫn triển khai hồ sơ bệnh án điện tử
    tại các cơ sở khám chữa bệnh. Mọi bệnh viện công lập và tư nhân phải hoàn thành trước
    30/9/2026. Đến 5/2026, đã có 1.231/1.650 bệnh viện triển khai (~75%). Không có EMR đồng
    nghĩa với không có dữ liệu cho AI.
- slug: vrhain
  vi: Mạng lưới AI y tế có trách nhiệm Việt Nam
  en: V-RHAIN
  short: Mạng lưới thúc đẩy AI y tế có trách nhiệm, ra mắt ngày 14/01/2026.
  long: >-
    V-RHAIN kết nối các bên liên quan và thúc đẩy giải pháp AI y tế có trách nhiệm, bao gồm hoạt
    động thử nghiệm trong điều kiện có kiểm soát. Việc mạng lưới ra mắt không chứng minh mọi nguyên
    tắc hoặc SOP trong cẩm nang là tài liệu chính thức do V-RHAIN ban hành; muốn quy thuộc một hướng
    dẫn cho mạng lưới phải dẫn đúng tài liệu đó.
  sources:
    - title: Trung tâm Thông tin Y tế Quốc gia về V-RHAIN
      url: https://nhic.vn/hoi-thao-ai-y-te-thanh-cong-ra-mat-mang-luoi-v-rhain-va-thuc-day-cac-giai-phap-ai-y-te-co-trach-nhiem/
- slug: aicotranhiem
  vi: AI có trách nhiệm
  en: Responsible AI
  short: >-
    Cách phát triển và sử dụng AI chú ý an toàn, quyền con người, công bằng và trách nhiệm giải
    trình.
  long: >-
    Trong y tế, AI có trách nhiệm đòi hỏi cân nhắc lợi ích và nguy cơ trong suốt quá trình sử dụng,
    không chỉ hiệu năng kỹ thuật. WHO nêu sáu nguyên tắc: tự chủ; sức khỏe, an toàn và lợi ích công;
    minh bạch, giải thích và dễ hiểu; trách nhiệm và giải trình; bao trùm và công bằng; đáp ứng và
    bền vững. Đây không phải một bộ bảy nguyên tắc mặc nhiên do V-RHAIN ban hành.
  sources:
    - title: 'WHO: đạo đức và quản trị AI y tế'
      url: https://www.who.int/publications/i/item/9789240029200
    - title: Trung tâm Thông tin Y tế Quốc gia về V-RHAIN
      url: https://nhic.vn/hoi-thao-ai-y-te-thanh-cong-ra-mat-mang-luoi-v-rhain-va-thuc-day-cac-giai-phap-ai-y-te-co-trach-nhiem/
- slug: luatdlcn
  vi: Luật Bảo vệ dữ liệu cá nhân 91/2025/QH15
  en: Personal Data Protection Law
  short: Luật Việt Nam về bảo vệ dữ liệu cá nhân, có hiệu lực từ 01/01/2026.
  long: >-
    Các mục thường dùng trong chương XIV: Điều 20 về chuyển dữ liệu xuyên biên giới, Điều 21 về đánh
    giá tác động xử lý, Điều 22 về cập nhật hồ sơ, Điều 23 về thông báo vi phạm, Điều 26 về thông
    tin sức khỏe, Điều 30 về xử lý trong AI và Điều 37 về trách nhiệm các bên. Phải đọc đúng chủ
    thể, điều kiện và ngoại lệ; không coi mọi sự cố đều tự động chịu nghĩa vụ thông báo 72 giờ. Việc
    Nghị định 13 hết hiệu lực được quy định tại Nghị định 356, không mô tả thành Luật 91 trực tiếp
    thay thế nghị định.
  sources:
    - title: Luật 91/2025/QH15, bản tiếng Việt
      url: https://mps.gov.vn/chinh-sach-phap-luat/co-so-du-lieu-van-ban/luat-bao-ve-du-lieu-ca-nhan-1753688803
    - title: Nghị định 356/2025/NĐ-CP
      url: https://vbpl.vn/TW/Lists/vbpq/Attachments/187276/ND.356.2025.doc
- slug: pii
  vi: Thông tin có thể nhận diện cá nhân
  en: Personally Identifiable Information (PII)
  short: Thông tin nhận ra một người trực tiếp hoặc khi kết hợp với dữ liệu khác, không chỉ họ tên.
  long: >-
    Mã bệnh án, số giấy tờ và địa chỉ là những ví dụ cần lưu ý. Ngày sinh, mã khoa, thời điểm khám
    và bệnh hiếm cũng có thể giúp nhận ra một người khi ghép nối. PII là thuật ngữ tham khảo; khi áp
    dụng pháp luật Việt Nam cần đối chiếu khái niệm dữ liệu cá nhân và phạm vi của văn bản hiện
    hành, không tự coi hai hệ thuật ngữ hoàn toàn tương đương.
  sources:
    - title: NIST SP 800-188
      url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-188.pdf
    - title: Luật 91/2025/QH15, bản tiếng Việt
      url: https://mps.gov.vn/chinh-sach-phap-luat/co-so-du-lieu-van-ban/luat-bao-ve-du-lieu-ca-nhan-1753688803
- slug: kanonymity
  vi: Tính không phân biệt theo nhóm k bản ghi
  en: k-anonymity
  short: Mỗi tổ hợp trường nhận diện gián tiếp xuất hiện ở ít nhất k bản ghi, tính cả bản ghi đang xét.
  long: >-
    K-anonymity là một cách đánh giá dữ liệu dạng bảng theo các trường nhận diện gián tiếp đã chọn.
    Với k = 5, mỗi nhóm có ít nhất năm bản ghi, không phải năm bản ghi khác ngoài bản ghi đang xét.
    Nếu mỗi người một dòng, nhóm tương ứng ít nhất năm người. Phương pháp không tự ngăn suy luận
    bệnh khi cả nhóm có cùng chẩn đoán, cũng không tự bảo vệ văn bản tự do hoặc ảnh. Không có ngưỡng
    k ≥ 5 bắt buộc phổ quát trong NIST SP 800-188; Luật 91 và Nghị định 356 được đối chiếu trong
    chương XIV không đặt một ngưỡng chung như vậy cho mọi bộ dữ liệu y tế.
  sources:
    - title: NIST SP 800-188
      url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-188.pdf
    - title: Luật 91/2025/QH15, bản tiếng Việt
      url: https://mps.gov.vn/chinh-sach-phap-luat/co-so-du-lieu-van-ban/luat-bao-ve-du-lieu-ca-nhan-1753688803
    - title: Nghị định 356/2025/NĐ-CP
      url: https://vbpl.vn/TW/Lists/vbpq/Attachments/187276/ND.356.2025.doc
- slug: dpo
  vi: Đầu mối bảo vệ dữ liệu
  en: Data Protection Officer
  short: Cá nhân hoặc bộ phận chịu trách nhiệm giám sát tuân thủ pháp luật về bảo vệ dữ liệu cá nhân.
  long: |
    DPO là vai trò bắt buộc với các tổ chức xử lý dữ liệu cá nhân nhạy cảm hoặc dữ liệu
    quy mô lớn theo Luật 91/2025. Nhiệm vụ chính bao gồm tư vấn tuân thủ, giám sát các
    hoạt động xử lý dữ liệu, làm đầu mối liên lạc với chủ thể dữ liệu và cơ quan chức
    năng, thực hiện đánh giá tác động bảo vệ dữ liệu. Với bệnh viện, đây thường là chức
    năng do phòng CNTT hoặc phòng pháp chế đảm nhiệm.
- slug: dpa
  vi: Hợp đồng xử lý dữ liệu
  en: Data Processing Agreement
  short: Hợp đồng giữa bên kiểm soát và bên xử lý dữ liệu ràng buộc mục đích, phạm vi, biện pháp bảo vệ.
  long: |
    DPA là công cụ pháp lý bắt buộc khi bên kiểm soát dữ liệu chuyển dữ liệu cá nhân cho
    bên xử lý (Điều 37 khoản 2 Luật 91/2025). Nội dung tối thiểu gồm: mục đích và phạm vi
    xử lý, thời hạn, loại dữ liệu, quyền của chủ thể dữ liệu, biện pháp bảo vệ, cơ chế
    thông báo vi phạm, trách nhiệm bồi thường. Khi bệnh viện dùng dịch vụ LLM Enterprise
    (ChatGPT, Claude, Gemini), cần ký DPA với nhà cung cấp trước khi đưa dữ liệu bệnh nhân
    vào — kể cả sau khi đã phi danh hóa.
- slug: owasp
  vi: OWASP Top 10 cho LLM và AI tạo sinh
  en: OWASP Top 10 for LLM Applications 2025
  short: Danh mục mười nhóm rủi ro bảo mật của ứng dụng LLM, kèm hướng giảm thiểu; không phải luật.
  long: >-
    Bản 2025 gồm: Prompt Injection; Sensitive Information Disclosure; Supply Chain; Data and Model
    Poisoning; Improper Output Handling; Excessive Agency; System Prompt Leakage; Vector and
    Embedding Weaknesses; Misinformation; Unbounded Consumption. Danh mục giúp đánh giá ứng dụng LLM
    và AI tạo sinh, không bao phủ mọi rủi ro của AI đọc phim hoặc thiết bị y tế. Ví dụ y tế ở chương
    XIV là tình huống mô phỏng do cẩm nang chuyển thể.
  sources:
    - title: OWASP Top 10 for LLM Applications 2025
      url: https://owasp.org/www-project-top-10-for-large-language-model-applications/assets/PDF/OWASP-Top-10-for-LLMs-v2025.pdf
- slug: promptinjection
  vi: Chèn chỉ dẫn để đánh lừa AI
  en: Prompt Injection
  short: Chỉ dẫn trong câu hỏi hoặc tài liệu khiến AI làm lệch nhiệm vụ; không nhất thiết phải là chữ ẩn.
  long: >-
    Đây là LLM01 trong OWASP 2025. Chỉ dẫn có thể đi trực tiếp từ người dùng hoặc gián tiếp qua tài
    liệu/trang web được AI đọc. Ví dụ mô phỏng: tài liệu bảo trợ lý bỏ nhiệm vụ và tiết lộ dữ liệu
    khác. Không chỉ dựa vào một câu nhắc bảo mật để phòng vệ; cần giới hạn quyền, kiểm soát dữ liệu
    và có người duyệt hành động nhạy cảm.
  sources:
    - title: OWASP Top 10 for LLM Applications 2025
      url: https://owasp.org/www-project-top-10-for-large-language-model-applications/assets/PDF/OWASP-Top-10-for-LLMs-v2025.pdf
- slug: phi
  vi: Thông tin sức khỏe có thể nhận diện người bệnh
  en: Protected Health Information (PHI)
  short: >-
    Trong cẩm nang: thông tin sức khỏe nhận diện người bệnh trực tiếp hoặc khi ghép với dữ liệu
    khác.
  long: >-
    PHI là thuật ngữ có phạm vi pháp lý cụ thể trong HIPAA của Hoa Kỳ, gắn với chủ thể và loại thông
    tin được luật điều chỉnh. Cẩm nang dùng PHI như cách nhắc ngắn về thông tin sức khỏe có thể nhận
    diện người bệnh; không mặc nhiên áp dụng HIPAA tại Việt Nam. Bệnh án chỉ xóa tên vẫn có thể nhận
    diện qua mã hồ sơ, ngày sinh, bệnh hiếm hoặc ảnh. Lab chỉ dùng ca mô phỏng đã cho, không dùng hồ
    sơ thật.
  sources:
    - title: 'HHS: Summary of the HIPAA Privacy Rule'
      url: https://www.hhs.gov/hipaa/for-professionals/privacy/laws-regulations/index.html
    - title: Luật 91/2025/QH15, bản tiếng Việt
      url: https://mps.gov.vn/chinh-sach-phap-luat/co-so-du-lieu-van-ban/luat-bao-ve-du-lieu-ca-nhan-1753688803
- slug: sop
  vi: Quy trình thao tác chuẩn
  en: Standard Operating Procedure (SOP)
  short: Hướng dẫn ai làm gì, theo bước nào và báo cho ai; tại bệnh viện cần được phê duyệt, ban hành.
  long: >-
    Trong cẩm nang, SOP là cách cơ sở cụ thể hóa công việc thành quy trình có trách nhiệm và bước
    kiểm tra rõ ràng. Ví dụ đề xuất: công cụ được dùng, loại dữ liệu được nhập, người duyệt và đầu
    mối báo sự cố. SOP không phải một điều luật; nội dung đề xuất trong chương chỉ trở thành quy
    định nội bộ khi cơ sở có thẩm quyền phê duyệt, ban hành phù hợp pháp luật.
- slug: automation-bias
  vi: Thiên lệch do tin tự động hóa
  en: Automation Bias
  short: Quá tin gợi ý của máy, đến mức bỏ qua bằng chứng khác hoặc không kiểm tra điều máy bỏ sót.
  long: >-
    Ví dụ mô phỏng: ký kết quả chỉ vì AI báo bình thường trong khi chưa đọc đủ phim. Đây là nguy cơ
    trong tương tác người và hệ thống, không đơn thuần là lỗi mô hình. Cần duy trì đánh giá độc lập
    và quy trình xử lý bất đồng, thay vì chỉ nhắc người dùng cẩn thận hơn.
  sources:
    - title: Tổng quan CDSS, npj Digital Medicine
      url: https://www.nature.com/articles/s41746-020-0221-y
    - title: 'AHRQ: Electronic Health Records'
      url: https://psnet.ahrq.gov/primer/electronic-health-records
- slug: alert-fatigue
  vi: Mệt mỏi với cảnh báo
  en: Alert Fatigue
  short: Tiếp xúc quá nhiều cảnh báo khiến người dùng giảm chú ý và có thể bỏ qua cảnh báo quan trọng.
  long: >-
    Cảnh báo quá nhiều, ít phù hợp hoặc lặp lại có thể khiến nhân viên y tế đóng theo phản xạ. Không
    nên giải quyết bằng cách tự tắt toàn bộ cảnh báo; cơ sở cần rà độ phù hợp, mức ưu tiên và quy
    trình phản hồi để giữ các cảnh báo có ý nghĩa lâm sàng.
  sources:
    - title: 'AHRQ: Alert Fatigue'
      url: https://psnet.ahrq.gov/primer/alert-fatigue
- slug: bias
  vi: Thiên lệch của hệ thống AI
  en: AI Bias
  short: Sai lệch có tính hệ thống có thể làm kết quả hoặc lợi ích khác nhau giữa các nhóm người.
  long: >-
    Trong y tế, dữ liệu và điều kiện đánh giá không đại diện đầy đủ có thể làm công cụ hoạt động kém
    ở một nhóm người bệnh. Không thể suy ra độ phù hợp cho trẻ em, thai phụ hoặc nhóm bệnh hiếm chỉ
    từ chỉ số chung. Thiên lệch hệ thống khác với thiên lệch do người dùng quá tin máy, dù hai nguy
    cơ có thể cùng xuất hiện.
  sources:
    - title: 'WHO: đạo đức và quản trị AI y tế'
      url: https://www.who.int/publications/i/item/9789240029200
- slug: de-identification
  vi: Khử nhận dạng dữ liệu
  en: De-identification
  short: Xử lý thông tin để không còn xác định hoặc giúp xác định người cụ thể; không chỉ xóa tên.
  long: >-
    Cần rà cả định danh trực tiếp, các trường có thể ghép nối, văn bản tự do và ảnh. Trong phạm vi
    Việt Nam, khoản 11 Điều 2 Luật 91 định nghĩa theo kết quả không thể xác định hoặc giúp xác định
    cá nhân; khoản 6 Điều 14 yêu cầu kiểm soát quá trình và không tái nhận dạng, trừ trường hợp luật
    định. Thuật ngữ kỹ thuật trong tài liệu quốc tế có thể khác về mức bảo đảm; phải đánh giá bộ dữ
    liệu và bối cảnh cụ thể.
  sources:
    - title: Luật 91/2025/QH15, bản tiếng Việt
      url: https://mps.gov.vn/chinh-sach-phap-luat/co-so-du-lieu-van-ban/luat-bao-ve-du-lieu-ca-nhan-1753688803
    - title: NIST SP 800-188
      url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-188.pdf
- slug: quasi-identifier
  vi: Trường nhận diện gián tiếp
  en: Quasi-identifier
  short: Trường dữ liệu có thể giúp nhận ra một người khi kết hợp với trường khác hoặc nguồn bên ngoài.
  long: >-
    Ví dụ giả định: ngày sinh đầy đủ, mã khoa, ngày khám, địa bàn hoặc bệnh hiếm. Từng trường riêng
    lẻ có thể chưa chỉ ra ai, nhưng tổ hợp có thể khớp một người duy nhất. Đây là nhóm trường cần
    chọn và kiểm tra khi đánh giá k-anonymity; không có một danh sách cố định đủ cho mọi bộ dữ liệu.
  sources:
    - title: NIST SP 800-188
      url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-188.pdf
- slug: re-identification
  vi: Tái định danh
  en: Re-identification
  short: Liên kết dữ liệu đã được xử lý để nhận ra lại cá nhân mà dữ liệu đó nói đến.
  long: >-
    Ví dụ giả định: ghép bảng đã xóa tên nhưng còn ngày sinh, ngày nhập viện và mã khoa với lịch
    tiếp nhận. Nguy cơ phụ thuộc cả dữ liệu chia sẻ và thông tin mà bên khác có thể tiếp cận. Đạt
    một tiêu chí kỹ thuật không bảo đảm không thể tái định danh trong mọi bối cảnh.
  sources:
    - title: NIST SP 800-188
      url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-188.pdf
    - title: Luật 91/2025/QH15, bản tiếng Việt
      url: https://mps.gov.vn/chinh-sach-phap-luat/co-so-du-lieu-van-ban/luat-bao-ve-du-lieu-ca-nhan-1753688803
- slug: pseudonymization
  vi: Thay định danh bằng mã
  en: Pseudonymization
  short: Thay tên hoặc định danh bằng mã; người có bảng đối chiếu vẫn có thể nhận ra cá nhân.
  long: >-
    Ví dụ mô phỏng: thay mã bệnh án bằng mã nghiên cứu rồi giữ bảng đối chiếu ở nơi khác. Cần tách
    và giới hạn quyền giữ bảng đối chiếu; dữ liệu không tự trở thành dữ liệu vô danh chỉ vì đã đổi
    mã. Đây là phân biệt kỹ thuật để tránh nhầm với khử nhận dạng theo kết quả mà pháp luật Việt Nam
    yêu cầu.
  sources:
    - title: NIST SP 800-188
      url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-188.pdf
    - title: Luật 91/2025/QH15, bản tiếng Việt
      url: https://mps.gov.vn/chinh-sach-phap-luat/co-so-du-lieu-van-ban/luat-bao-ve-du-lieu-ca-nhan-1753688803
- slug: metadata
  vi: Thông tin mô tả đi kèm dữ liệu
  en: Metadata
  short: Thông tin về tệp hoặc bản ghi, như thời gian tạo, thiết bị, mã hồ sơ; có thể chứa định danh.
  long: >-
    Trong ảnh y khoa, ngoài phần ảnh còn có những thuộc tính mô tả việc chụp, thiết bị hoặc người
    bệnh. Metadata có thể chứa tên, mã hồ sơ hoặc ngày sinh; ngược lại, định danh cũng có thể nằm
    ngay trong chữ trên ảnh. Vì vậy không chỉ kiểm tra tên tệp hoặc các thuộc tính đi kèm.
  sources:
    - title: DICOM PS3.15, Phụ lục E
      url: https://dicom.nema.org/medical/dicom/current/output/chtml/part15/chapter_e.html
- slug: authentication
  vi: Xác thực
  en: Authentication
  short: Kiểm tra người dùng, thiết bị hoặc dịch vụ có đúng là danh tính mà họ khai báo hay không.
  long: >-
    Xác thực trả lời câu hỏi “có đúng là người hoặc hệ thống này không?”. Phân quyền trả lời câu hỏi
    khác: “được xem hoặc làm gì?”. Đăng nhập thành công không có nghĩa được đọc mọi hồ sơ; cách
    triển khai cần phù hợp với hệ thống và yêu cầu pháp luật.
  sources:
    - title: 'NIST: Authentication'
      url: https://csrc.nist.gov/glossary/term/authentication
    - title: Luật 91/2025/QH15, bản tiếng Việt
      url: https://mps.gov.vn/chinh-sach-phap-luat/co-so-du-lieu-van-ban/luat-bao-ve-du-lieu-ca-nhan-1753688803
- slug: authorization
  vi: Phân quyền truy cập
  en: Authorization
  short: Quy định và kiểm soát người dùng hoặc hệ thống được xem dữ liệu nào, thực hiện thao tác nào.
  long: >-
    Ví dụ đề xuất: quyền đọc một hồ sơ không tự bao gồm quyền xuất cả cơ sở dữ liệu cho nhà cung
    cấp. Phân quyền cần được áp dụng cả ở nguồn dữ liệu, bước truy xuất và thao tác của AI, không
    chỉ ở màn hình đăng nhập. Khái niệm này khác với xác thực danh tính.
  sources:
    - title: 'NIST: Authorization'
      url: https://csrc.nist.gov/glossary/term/authorization
    - title: OWASP Top 10 for LLM Applications 2025
      url: https://owasp.org/www-project-top-10-for-large-language-model-applications/assets/PDF/OWASP-Top-10-for-LLMs-v2025.pdf
- slug: cross-border-transfer
  vi: Chuyển dữ liệu cá nhân xuyên biên giới
  en: Cross-border Personal Data Transfer
  short: >-
    Hoạt động chuyển hoặc xử lý dữ liệu thuộc phạm vi Điều 20 Luật 91; không chỉ gửi một tệp ra nước
    ngoài.
  long: >-
    Điều 20 bao gồm các trường hợp lưu trữ, chuyển cho bên ở nước ngoài và dùng nền tảng ngoài lãnh
    thổ Việt Nam để xử lý dữ liệu cá nhân được thu thập tại Việt Nam. Cần xét kiến trúc, vai trò các
    bên, nghĩa vụ đánh giá tác động và ngoại lệ cụ thể. Điều 22 quy định cập nhật hồ sơ đánh giá tác
    động, không phải điều định danh hoạt động chuyển xuyên biên giới.
  sources:
    - title: Luật 91/2025/QH15, bản tiếng Việt
      url: https://mps.gov.vn/chinh-sach-phap-luat/co-so-du-lieu-van-ban/luat-bao-ve-du-lieu-ca-nhan-1753688803
- slug: impact-assessment
  vi: Đánh giá tác động bảo vệ dữ liệu cá nhân
  en: Personal Data Protection Impact Assessment
  short: Xem xét hoạt động xử lý, nguy cơ và biện pháp bảo vệ; không chỉ điền một biểu mẫu.
  long: >-
    Chương XIV phân biệt hồ sơ đánh giá tác động chuyển dữ liệu xuyên biên giới tại Điều 20 và đánh
    giá tác động xử lý tại Điều 21 Luật 91; Điều 22 về cập nhật hồ sơ. Đầu mối có trách nhiệm phải
    xác định nghĩa vụ, thời điểm và ngoại lệ áp dụng. Không dùng thời hạn gửi hồ sơ như quyền tự ý
    chuyển dữ liệu trước rồi xin phép sau.
  sources:
    - title: Luật 91/2025/QH15, bản tiếng Việt
      url: https://mps.gov.vn/chinh-sach-phap-luat/co-so-du-lieu-van-ban/luat-bao-ve-du-lieu-ca-nhan-1753688803
- slug: data-controller
  vi: Bên kiểm soát dữ liệu cá nhân
  en: Personal Data Controller
  short: Bên quyết định mục đích và phương tiện xử lý dữ liệu cá nhân.
  long: >-
    Vai trò được xác định theo hoạt động thực tế, không chỉ theo tên trong hợp đồng. Một bên vừa
    quyết định mục đích/phương tiện vừa trực tiếp xử lý có thể thuộc vai trò bên kiểm soát và xử lý.
    Điều 37 Luật 91 phân định trách nhiệm; bệnh viện cần xác định đúng vai trò của mình và của nhà
    cung cấp.
  sources:
    - title: Luật 91/2025/QH15, bản tiếng Việt
      url: https://mps.gov.vn/chinh-sach-phap-luat/co-so-du-lieu-van-ban/luat-bao-ve-du-lieu-ca-nhan-1753688803
- slug: data-processor
  vi: Bên xử lý dữ liệu cá nhân
  en: Personal Data Processor
  short: Bên thực hiện xử lý dữ liệu theo yêu cầu của bên kiểm soát, thông qua hợp đồng hoặc thỏa thuận.
  long: >-
    Không mặc định mọi nhà cung cấp AI đều chỉ là bên xử lý, nhất là khi họ quyết định mục đích sử
    dụng riêng. Điều 37 Luật 91 quy định trách nhiệm và việc tiếp nhận dữ liệu sau thỏa thuận/hợp
    đồng; khi phát hiện vi phạm, bên xử lý có nghĩa vụ thông báo kịp thời cho bên kiểm soát tương
    ứng theo Điều 23.
  sources:
    - title: Luật 91/2025/QH15, bản tiếng Việt
      url: https://mps.gov.vn/chinh-sach-phap-luat/co-so-du-lieu-van-ban/luat-bao-ve-du-lieu-ca-nhan-1753688803
- slug: sensitive-disclosure
  vi: Tiết lộ thông tin nhạy cảm
  en: Sensitive Information Disclosure (LLM02)
  short: Ứng dụng AI làm lộ dữ liệu cá nhân, bí mật hoặc thông tin không được phép cung cấp.
  long: >-
    Ví dụ mô phỏng: trợ lý trả thông tin người bệnh khác cho người hỏi. Cần tối thiểu hóa dữ liệu
    đầu vào, giới hạn truy cập và kiểm tra đầu ra; không chỉ dựa vào lời dặn mô hình giữ bí mật. Đây
    là nhóm rủi ro kỹ thuật trong OWASP, không tự xác định nghĩa vụ thông báo của một sự cố theo
    luật Việt Nam.
  sources:
    - title: OWASP Top 10 for LLM Applications 2025
      url: https://owasp.org/www-project-top-10-for-large-language-model-applications/assets/PDF/OWASP-Top-10-for-LLMs-v2025.pdf
- slug: ai-supply-chain
  vi: Chuỗi cung ứng của ứng dụng AI
  en: AI Supply Chain (LLM03)
  short: Các mô hình, dữ liệu, thư viện, tiện ích và nhà cung cấp mà ứng dụng AI phụ thuộc.
  long: >-
    Một thành phần không đáng tin hoặc bị thay đổi có thể ảnh hưởng đến toàn bộ ứng dụng. Ví dụ mô
    phỏng: tiện ích được thêm vào trợ lý bệnh viện có quyền đọc hồ sơ nhưng chưa được duyệt. Cơ sở
    cần đánh giá nguồn gốc, quyền truy cập và thay đổi phiên bản, không chỉ tên hãng của sản phẩm
    chính.
  sources:
    - title: OWASP Top 10 for LLM Applications 2025
      url: https://owasp.org/www-project-top-10-for-large-language-model-applications/assets/PDF/OWASP-Top-10-for-LLMs-v2025.pdf
- slug: data-model-poisoning
  vi: Đầu độc dữ liệu và mô hình
  en: Data and Model Poisoning (LLM04)
  short: Can thiệp dữ liệu hoặc mô hình để làm sai hành vi, kết quả hay tính an toàn của AI.
  long: >-
    Ví dụ mô phỏng: tài liệu hướng dẫn bị sửa trái phép rồi được đưa vào nguồn tham khảo của trợ lý.
    Cần quản lý nguồn, phiên bản và quyền cập nhật, kiểm tra trước khi sử dụng. Nguy cơ có thể xuất
    hiện trong quá trình huấn luyện, tinh chỉnh hoặc nguồn dữ liệu ứng dụng sử dụng.
  sources:
    - title: OWASP Top 10 for LLM Applications 2025
      url: https://owasp.org/www-project-top-10-for-large-language-model-applications/assets/PDF/OWASP-Top-10-for-LLMs-v2025.pdf
- slug: improper-output-handling
  vi: Xử lý đầu ra không an toàn
  en: Improper Output Handling (LLM05)
  short: Đưa đầu ra AI sang phần mềm hoặc thao tác khác mà chưa kiểm tra an toàn.
  long: >-
    Đầu ra của AI có thể là văn bản, mã hoặc chỉ dẫn không đáng tin cậy. Nếu hệ thống tiếp nhận và
    thực thi trực tiếp, lỗi có thể lan sang hệ thống khác. Cần kiểm tra, làm sạch và giới hạn cách
    sử dụng đầu ra; câu trả lời AI không tự trở thành lệnh được phép thực hiện.
  sources:
    - title: OWASP Top 10 for LLM Applications 2025
      url: https://owasp.org/www-project-top-10-for-large-language-model-applications/assets/PDF/OWASP-Top-10-for-LLMs-v2025.pdf
- slug: excessive-agency
  vi: Trao quyền hành động quá mức cho AI
  en: Excessive Agency (LLM06)
  short: AI được cấp quá nhiều chức năng, quyền hoặc khả năng tự hành động so với nhiệm vụ.
  long: >-
    Ví dụ mô phỏng: trợ lý có thể tự sửa bệnh án hay gửi hướng dẫn điều trị khi chưa được người có
    thẩm quyền duyệt. Cần cấp quyền tối thiểu, giới hạn thao tác và yêu cầu người duyệt hành động có
    hậu quả lớn; không nhầm khả năng gợi ý với thẩm quyền thực hiện.
  sources:
    - title: OWASP Top 10 for LLM Applications 2025
      url: https://owasp.org/www-project-top-10-for-large-language-model-applications/assets/PDF/OWASP-Top-10-for-LLMs-v2025.pdf
- slug: system-prompt-leakage
  vi: Lộ chỉ dẫn hệ thống
  en: System Prompt Leakage (LLM07)
  short: Nội dung hướng dẫn hoặc cấu hình nội bộ của trợ lý bị tiết lộ ngoài dự kiến.
  long: >-
    Chỉ dẫn hệ thống đặt cách ứng dụng muốn AI hoạt động; không phải kho lưu bí mật an toàn. Không
    đưa mật khẩu, khóa truy cập hoặc dữ liệu nhạy cảm vào chỉ dẫn rồi trông chờ câu “không tiết lộ”
    bảo vệ chúng. Kiểm soát truy cập và xác thực phải được thực thi ở hệ thống bên ngoài mô hình.
  sources:
    - title: OWASP Top 10 for LLM Applications 2025
      url: https://owasp.org/www-project-top-10-for-large-language-model-applications/assets/PDF/OWASP-Top-10-for-LLMs-v2025.pdf
- slug: vector-embedding-weaknesses
  vi: Điểm yếu véc-tơ và embedding
  en: Vector and Embedding Weaknesses (LLM08)
  short: >-
    Lỗ hổng trong cách biểu diễn, lưu trữ hoặc truy xuất dữ liệu có thể làm lộ hay làm sai thông
    tin.
  long: >-
    Trong ứng dụng RAG, việc tìm đoạn tài liệu bằng embedding không thay thế kiểm tra quyền. Ví dụ
    mô phỏng: kho tìm kiếm trả hồ sơ thuộc khoa hoặc nhóm người dùng khác. Cần kiểm soát quyền tại
    nguồn và truy xuất, tách phạm vi dữ liệu phù hợp và kiểm tra dữ liệu được đưa vào kho.
  sources:
    - title: OWASP Top 10 for LLM Applications 2025
      url: https://owasp.org/www-project-top-10-for-large-language-model-applications/assets/PDF/OWASP-Top-10-for-LLMs-v2025.pdf
- slug: misinformation
  vi: Thông tin sai hoặc gây hiểu lầm
  en: Misinformation (LLM09)
  short: Thông tin không chính xác do ứng dụng LLM cung cấp, dù có thể được diễn đạt thuyết phục.
  long: >-
    Thông tin sai có thể do nội dung bịa đặt, dữ liệu lỗi thời hoặc diễn giải không đúng. Ví dụ mô
    phỏng: trích sai điều luật hoặc thêm xét nghiệm không tồn tại. Phải đối chiếu nguồn và hồ sơ;
    một đường dẫn có thật không chứng minh nội dung AI gán cho nguồn là đúng.
  sources:
    - title: OWASP Top 10 for LLM Applications 2025
      url: https://owasp.org/www-project-top-10-for-large-language-model-applications/assets/PDF/OWASP-Top-10-for-LLMs-v2025.pdf
- slug: unbounded-consumption
  vi: Tiêu thụ tài nguyên không giới hạn
  en: Unbounded Consumption (LLM10)
  short: Yêu cầu hoặc tác vụ AI dùng tài nguyên vượt kiểm soát, gây gián đoạn hoặc tăng chi phí.
  long: >-
    Tác vụ lặp, yêu cầu quá lớn hoặc sử dụng không kiểm soát có thể làm giảm khả năng phục vụ. Cần
    giới hạn sử dụng, thời gian và quyền thực hiện; giám sát bất thường và có phương án dừng tác vụ.
    Đây không chỉ là chuyện trả lời dài.
  sources:
    - title: OWASP Top 10 for LLM Applications 2025
      url: https://owasp.org/www-project-top-10-for-large-language-model-applications/assets/PDF/OWASP-Top-10-for-LLMs-v2025.pdf
